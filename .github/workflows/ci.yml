name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc -b
      - run: npx eslint .
      - run: npm test
      - run: npm run build
      - run: python3 scripts/validate-data.py
      # The committed data must be what the build script produces from the SQL source.
      - run: python3 scripts/build-sites-json.py && python3 scripts/export-wikimedia.py && git diff --exit-code
